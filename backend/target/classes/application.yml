server:
  port: 8080

spring:
  application:
    name: movieverse-backend
  datasource:
    url: jdbc:h2:mem:movieversedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

movieverse:
  app:
    jwtSecret: movieVerse3DSuperSecretKeyWithMinimum256BitsLengthForSecurity12345
    jwtExpirationMs: 86400000
